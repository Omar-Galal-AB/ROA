# roa_physics_config.ini
# ROA Physics Configuration
# Physics engine parameters for Chaos Physics to match Gazebo-equivalent accuracy

[Solver]
# Physics solver iterations
PositionIterations = 8
VelocityIterations = 8
Substeps = 6
EnableCCD = true

[World]
# World physics settings
Gravity = -980.0  # cm/s² (UE5 units, equivalent to -9.8 m/s²)
UnitScale = 1.0   # 1 UE unit = 1 cm

[Materials]
# Metal material properties
Metal_Friction_Static = 0.4
Metal_Friction_Dynamic = 0.35
Metal_Restitution = 0.3
Metal_Density = 7850.0  # kg/m³

# Plastic material properties
Plastic_Friction_Static = 0.5
Plastic_Friction_Dynamic = 0.4
Plastic_Restitution = 0.5
Plastic_Density = 1200.0  # kg/m³

# Rubber material properties
Rubber_Friction_Static = 0.9
Rubber_Friction_Dynamic = 0.8
Rubber_Restitution = 0.7
Rubber_Density = 1100.0  # kg/m³

# Concrete material properties
Concrete_Friction_Static = 0.6
Concrete_Friction_Dynamic = 0.5
Concrete_Restitution = 0.2
Concrete_Density = 2400.0  # kg/m³

[Joints]
# Default joint configuration
Damping = 0.1
Stiffness = 1000.0  # N/m
AngularLimit_Min = -180.0  # degrees
AngularLimit_Max = 180.0   # degrees
EnableMotorDrives = true

[Validation]
# Physics validation test parameters
DropTest_Height = 100.0  # cm
FrictionTest_Angle = 30.0  # degrees
JointTest_Range = 90.0  # degrees
