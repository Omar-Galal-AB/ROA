# Sample Tracking Configuration for DIMC
# This example shows how to configure tracking parameters for different scenarios

# Scenario: High-Precision Indoor Navigation
high_precision:
  tracking:
    position:
      update_rate: 100  # Higher rate for precision
      precision: 0.0001  # 0.1mm precision
      coordinate_system: "world"
      history_size: 600  # 6 seconds at 100Hz
    
    orientation:
      update_rate: 100
      format: "quaternion"
      
    velocity:
      update_rate: 100
      window_size: 20  # More smoothing
      
    distance:
      update_rate: 50
      max_distance: 10.0  # Indoor environment
  
  measurement:
    use_visual_mesh: true
    use_collision_mesh: true
    bounding_box_type: "OBB"  # Oriented bounding box for precision
    safety_margin: 0.05  # 5cm margin

# Scenario: Outdoor Construction Site
outdoor_construction:
  tracking:
    position:
      update_rate: 30  # Lower rate is sufficient
      precision: 0.01  # 1cm precision
      coordinate_system: "world"
      history_size: 300  # 10 seconds at 30Hz
    
    orientation:
      update_rate: 30
      format: "euler"  # Easier for human operators
      
    velocity:
      update_rate: 30
      window_size: 5  # Less smoothing
      
    distance:
      update_rate: 10  # Less frequent updates
      max_distance: 100.0  # Large outdoor area
  
  measurement:
    use_visual_mesh: true
    use_collision_mesh: true
    bounding_box_type: "AABB"  # Simpler, faster
    safety_margin: 0.2  # 20cm margin for safety

# Scenario: Multi-Robot Coordination (Default)
multi_robot_default:
  tracking:
    position:
      update_rate: 60
      precision: 0.001
      coordinate_system: "world"
      history_size: 300
    
    orientation:
      update_rate: 60
      format: "quaternion"
      
    velocity:
      update_rate: 60
      window_size: 10
      
    distance:
      update_rate: 20
      max_distance: 100.0
  
  measurement:
    use_visual_mesh: true
    use_collision_mesh: true
    bounding_box_type: "AABB"
    safety_margin: 0.1
