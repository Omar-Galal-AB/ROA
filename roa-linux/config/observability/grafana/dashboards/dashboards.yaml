# =============================================================================
# Grafana Dashboard Provisioning for ROA
# =============================================================================

apiVersion: 1

providers:
  - name: 'ROA Dashboards'
    orgId: 1
    folder: 'ROA'
    folderUid: 'roa'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
