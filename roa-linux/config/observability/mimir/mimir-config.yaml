# =============================================================================
# Grafana Mimir Configuration for ROA - Long-term Metrics Storage
# =============================================================================

# Multi-tenancy disabled for single-tenant deployment
multitenancy_enabled: false

# Target all components in single binary mode
target: all

# Server configuration
server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: info

# Common storage configuration
common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir

# Ingester configuration
ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory

# Distributor configuration
distributor:
  ring:
    kvstore:
      store: inmemory

# Compactor configuration
compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: inmemory

# Store-gateway configuration
store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory

# Blocks storage configuration
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks
  tsdb:
    dir: /data/mimir/tsdb
  bucket_store:
    sync_dir: /data/mimir/bucket-sync

# Ruler configuration
ruler:
  rule_path: /data/mimir/rules
  ring:
    kvstore:
      store: inmemory
  alertmanager_url: http://alertmanager:9093

# Alertmanager configuration
alertmanager:
  data_dir: /data/mimir/alertmanager
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory
  external_url: http://localhost:9009/alertmanager

# Query configuration
querier:
  max_concurrent: 20

# Frontend configuration
frontend:
  scheduler_address: ""
  log_queries_longer_than: 10s

# Query scheduler disabled for single instance
query_scheduler:
  service_discovery_mode: ""

# Limits
limits:
  # Ingestion
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  max_global_series_per_user: 1500000
  max_global_series_per_metric: 50000
  
  # Query
  max_fetched_series_per_query: 100000
  max_fetched_chunk_bytes_per_query: 2147483648  # 2GB
  
  # Retention
  compactor_blocks_retention_period: 365d  # 1 year

# Usage reporting disabled
usage_stats:
  enabled: false
