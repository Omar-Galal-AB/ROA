# =============================================================================
# ROA Log Parsers for Fluent Bit
# =============================================================================

# Standard ROA log format: [TIMESTAMP] [LEVEL] [COMPONENT] MESSAGE
[PARSER]
    Name        roa_log
    Format      regex
    Regex       ^\[(?<time>[^\]]+)\]\s*\[(?<level>\w+)\]\s*\[(?<component>\w+)\]\s*(?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S.%L
    Time_Keep   On

# ROA heartbeat log format
[PARSER]
    Name        roa_hb
    Format      regex
    Regex       ^HB:\s*(?<component>\w+)\s*->\s*(?<status>\w+)\s*@\s*(?<time>[^\s]+)\s*\(interval:\s*(?<interval>\d+)ms\)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

# ROA FTI telemetry format
[PARSER]
    Name        roa_fti
    Format      regex
    Regex       ^FTI:\s*(?<metric>\w+)=(?<value>[^\s]+)\s*@\s*(?<time>[^\s]+)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L

# ROA DIMC command format
[PARSER]
    Name        roa_dimc
    Format      regex
    Regex       ^CMD:\s*\[(?<cmd_id>\d+)\]\s*(?<command>\w+)\s*(?<params>.*)$

# Python traceback multiline start
[PARSER]
    Name        python_traceback
    Format      regex
    Regex       ^Traceback \(most recent call last\):$
    
# =============================================================================
# Generic Parsers
# =============================================================================

[PARSER]
    Name        json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name        json_nested
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name        syslog
    Format      regex
    Regex       ^\<(?<pri>[0-9]+)\>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
    Time_Key    time
    Time_Format %b %d %H:%M:%S

[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

# ROS2 /rosout format
[PARSER]
    Name        ros2_rosout
    Format      regex
    Regex       ^\[(?<level>\w+)\]\s*\[(?<time>[^\]]+)\]\s*\[(?<node>[^\]]+)\]:\s*(?<message>.*)$
    Time_Key    time
    Time_Format %s.%L

# Python logging format
[PARSER]
    Name        python_logging
    Format      regex
    Regex       ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})\s*-\s*(?<logger>[^\s]+)\s*-\s*(?<level>\w+)\s*-\s*(?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S,%L
    Time_Keep   On

# =============================================================================
# Multiline Parsers
# =============================================================================

[MULTILINE_PARSER]
    Name          python_exception
    Type          regex
    Flush_timeout 1000
    # First line is Traceback
    Rule          "start_state"   "^Traceback \(most recent call last\):" "cont"
    Rule          "cont"          "^[\t ]+File "                          "cont"
    Rule          "cont"          "^[\t ]+.*"                              "cont"
    Rule          "cont"          "^\w+.*"                                 "end"

[MULTILINE_PARSER]
    Name          roa_multiline
    Type          regex
    Flush_timeout 1000
    # Start with timestamp
    Rule          "start_state"   "^\[\d{4}-\d{2}-\d{2}"  "cont"
    # Continue if line starts with whitespace (continuation)
    Rule          "cont"          "^[\t ]+"               "cont"
