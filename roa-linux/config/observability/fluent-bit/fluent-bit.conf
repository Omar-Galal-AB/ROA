[SERVICE]
    # Flush interval in seconds
    Flush        1
    
    # Run in foreground
    Daemon       Off
    
    # Log level: error, warning, info, debug, trace
    Log_Level    info
    
    # Parsers file
    Parsers_File parsers.conf
    
    # Enable HTTP server for monitoring
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    
    # Storage metrics
    storage.metrics On

# =============================================================================
# INPUTS - Tail ROA Log Files
# =============================================================================

[INPUT]
    Name              tail
    Tag               roa.webthread
    Path              /var/log/roa/webthread.log
    Parser            roa_log
    Path_Key          filepath
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/roa/.fluent-bit-webthread.db

[INPUT]
    Name              tail
    Tag               roa.fti
    Path              /var/log/roa/fti.log
    Parser            roa_log
    Path_Key          filepath
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/roa/.fluent-bit-fti.db

[INPUT]
    Name              tail
    Tag               roa.dimc
    Path              /var/log/roa/dimc.log
    Parser            roa_log
    Path_Key          filepath
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/roa/.fluent-bit-dimc.db

[INPUT]
    Name              tail
    Tag               roa.roc
    Path              /var/log/roa/roc.log
    Parser            roa_log
    Path_Key          filepath
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/roa/.fluent-bit-roc.db

[INPUT]
    Name              tail
    Tag               roa.comc
    Path              /var/log/roa/comc.log
    Parser            roa_log
    Path_Key          filepath
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/roa/.fluent-bit-comc.db

# Tail all ROA logs with wildcard
[INPUT]
    Name              tail
    Tag               roa.all
    Path              /var/log/roa/*.log
    Exclude_Path      /var/log/roa/webthread.log,/var/log/roa/fti.log,/var/log/roa/dimc.log,/var/log/roa/roc.log,/var/log/roa/comc.log
    Parser            roa_log
    Path_Key          filepath
    Refresh_Interval  10
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# =============================================================================
# INPUTS - System Metrics
# =============================================================================

[INPUT]
    Name          cpu
    Tag           roa.metrics.cpu
    Interval_Sec  10

[INPUT]
    Name          mem
    Tag           roa.metrics.mem
    Interval_Sec  10

[INPUT]
    Name          disk
    Tag           roa.metrics.disk
    Interval_Sec  30
    Interval_Nsec 0

[INPUT]
    Name          netif
    Tag           roa.metrics.network
    Interval_Sec  10
    Interface     eth0

[INPUT]
    Name          proc
    Tag           roa.metrics.proc
    Interval_Sec  30
    Proc_Name     python3
    Alert         true
    Fd            true
    Mem           true

# =============================================================================
# FILTERS - Process and Enrich Logs
# =============================================================================

# Add hostname and environment to all logs
[FILTER]
    Name          record_modifier
    Match         roa.*
    Record        hostname ${HOSTNAME}
    Record        environment ${ROA_ENV:-development}
    Record        version ${ROA_VERSION:-1.0.0}

# Parse JSON fields if present in message
[FILTER]
    Name          parser
    Match         roa.*
    Key_Name      message
    Parser        json_nested
    Preserve_Key  On
    Reserve_Data  On

# Add severity labels based on log level
[FILTER]
    Name          modify
    Match         roa.*
    Condition     Key_Value_Equals level ERROR
    Add           severity error

[FILTER]
    Name          modify
    Match         roa.*
    Condition     Key_Value_Equals level WARN
    Add           severity warning

[FILTER]
    Name          modify
    Match         roa.*
    Condition     Key_Value_Equals level WARNING
    Add           severity warning

[FILTER]
    Name          modify
    Match         roa.*
    Condition     Key_Value_Equals level INFO
    Add           severity info

[FILTER]
    Name          modify
    Match         roa.*
    Condition     Key_Value_Equals level DEBUG
    Add           severity debug

# Extract component from tag
[FILTER]
    Name          rewrite_tag
    Match         roa.*
    Rule          $level ^ERROR$ roa.errors.${TAG[1]} false

# Convert logs to metrics (count by level)
[FILTER]
    Name              log_to_metrics
    Match             roa.webthread
    Tag               roa.metrics.logs.webthread
    Metric_Mode       counter
    Metric_Name       roa_log_messages_total
    Metric_Description Total number of ROA log messages
    Label_Field       level
    Label_Field       component

[FILTER]
    Name              log_to_metrics
    Match             roa.fti
    Tag               roa.metrics.logs.fti
    Metric_Mode       counter
    Metric_Name       roa_log_messages_total
    Metric_Description Total number of ROA log messages
    Label_Field       level
    Label_Field       component

# Throttle debug logs to avoid overwhelming storage
[FILTER]
    Name          throttle
    Match         roa.*
    Rate          1000
    Window        5
    Print_Status  true

# =============================================================================
# OUTPUTS - Send to Loki
# =============================================================================

[OUTPUT]
    Name          loki
    Match         roa.webthread
    Host          loki
    Port          3100
    Labels        job=roa, component=webthread
    Label_Keys    $level, $hostname, $severity
    Remove_Keys   filepath
    Auto_Kubernetes_Labels Off

[OUTPUT]
    Name          loki
    Match         roa.fti
    Host          loki
    Port          3100
    Labels        job=roa, component=fti
    Label_Keys    $level, $hostname, $severity
    Remove_Keys   filepath
    Auto_Kubernetes_Labels Off

[OUTPUT]
    Name          loki
    Match         roa.dimc
    Host          loki
    Port          3100
    Labels        job=roa, component=dimc
    Label_Keys    $level, $hostname, $severity
    Remove_Keys   filepath
    Auto_Kubernetes_Labels Off

[OUTPUT]
    Name          loki
    Match         roa.roc
    Host          loki
    Port          3100
    Labels        job=roa, component=roc
    Label_Keys    $level, $hostname, $severity
    Remove_Keys   filepath
    Auto_Kubernetes_Labels Off

[OUTPUT]
    Name          loki
    Match         roa.comc
    Host          loki
    Port          3100
    Labels        job=roa, component=comc
    Label_Keys    $level, $hostname, $severity
    Remove_Keys   filepath
    Auto_Kubernetes_Labels Off

[OUTPUT]
    Name          loki
    Match         roa.all
    Host          loki
    Port          3100
    Labels        job=roa, component=other
    Label_Keys    $level, $hostname, $filepath
    Auto_Kubernetes_Labels Off

[OUTPUT]
    Name          loki
    Match         roa.errors.*
    Host          loki
    Port          3100
    Labels        job=roa, severity=error
    Label_Keys    $level, $hostname, $component
    Auto_Kubernetes_Labels Off

# =============================================================================
# OUTPUTS - Prometheus Metrics
# =============================================================================

[OUTPUT]
    Name          prometheus_exporter
    Match         roa.metrics.*
    Host          0.0.0.0
    Port          2021
    Add_label     app roa
    Add_label     instance ${HOSTNAME}

# =============================================================================
# OUTPUTS - OpenTelemetry (to Alloy/Tempo)
# =============================================================================

[OUTPUT]
    Name          opentelemetry
    Match         roa.*
    Host          alloy
    Port          4317
    Logs_uri      /v1/logs
    Tls           Off
    Tls.verify    Off
    Add_label     service.name roa
    Add_label     service.namespace robotics

# =============================================================================
# OUTPUTS - Stdout for debugging (optional)
# =============================================================================

# Uncomment for debugging
# [OUTPUT]
#     Name          stdout
#     Match         roa.*
#     Format        json_lines
