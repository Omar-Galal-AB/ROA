name: Feature Request
description: Suggest a new feature or enhancement for ROA
title: "[Feature]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Help us understand your idea.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component would this affect?
      options:
        - roa-linux (Core application)
        - ue5-plugin (Unreal Engine plugin)
        - FTI (Files Type Importer)
        - DIMC (Dimensions Collector)
        - ROC (Robot Operator Controller)
        - COMC (Communication Center)
        - WEBTHREAD (Coordinator)
        - Documentation
        - Multiple components
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical (blocking current work)
        - High (important for production use)
        - Medium (would improve workflow)
        - Low (nice to have)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
      placeholder: "As a [user type], I need [functionality] because [reason]..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
      placeholder: Describe your ideal solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions have you thought about?
      placeholder: Describe alternative approaches

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, diagrams, related issues, etc.
      placeholder: Any additional information

  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      description: Would you be willing to help implement this?
      options:
        - label: I can help implement this feature
          required: false
        - label: I can help test this feature
          required: false
        - label: I can help document this feature
          required: false
