name: Bug Report
description: Report a bug or issue with ROA
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the sections below.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - roa-linux (Core application)
        - ue5-plugin (Unreal Engine plugin)
        - FTI (Files Type Importer)
        - DIMC (Dimensions Collector)
        - ROC (Robot Operator Controller)
        - COMC (Communication Center)
        - WEBTHREAD (Coordinator)
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform are you using?
      options:
        - Linux (Ubuntu 22.04)
        - Linux (Ubuntu 24.04)
        - WSL2 (Ubuntu 22.04)
        - WSL2 (Ubuntu 24.04)
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ROA Version
      description: "Run `roa --version` or check ROA.uplugin"
      placeholder: "e.g., v0.2.0-alpha"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of what went wrong
      placeholder: Describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Start ROA with...
        2. Import robot...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Describe expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: Describe actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/Error Messages
      description: "Paste relevant logs (check roa-linux/data/logs/ or UE5 Output Log)"
      render: shell
      placeholder: Paste logs here

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, robot models used, configuration changes, etc.
      placeholder: Any additional information
